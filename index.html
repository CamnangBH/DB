<style>
:root{--blue:#0068B4;--blue-d:#003E80;--navy:#0A2350;--line:#DCE6F2;--muted:#5A6A82;--red:#D93025;--gold:#F5A623}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(125deg,#062452 0%,#003E80 50%,#0A84D8 100%);color:#14223A;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
body::after{content:"90";position:fixed;right:-20px;bottom:-90px;font-size:340px;font-weight:900;color:rgba(255,255,255,.05);line-height:1;pointer-events:none}
.box{width:100%;max-width:410px;background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;position:relative;z-index:1}
.top{padding:26px 28px 20px;background:linear-gradient(125deg,#0A2350,#0068B4);color:#fff}
.badge{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);font-weight:900;font-size:17px}
.top h1{font-size:22px;font-weight:900;margin-top:14px;line-height:1.15}
.top h1 span{color:#FFD166}
.top p{font-size:13.5px;opacity:.85;margin-top:4px}
form{padding:24px 28px 26px}
label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:0 0 6px}
.f{position:relative;margin-bottom:16px}
input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;outline:none;transition:.2s;background:#F7FAFE}
input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(0,104,180,.12)}
.eye{position:absolute;right:8px;bottom:7px;height:32px;padding:0 10px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;border-radius:8px}
.eye:hover{background:#EAF3FC;color:var(--blue)}
button.go{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(90deg,#0A84D8,#003E80);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px}
button.go:hover{filter:brightness(1.08)}
button.go:disabled{opacity:.7;cursor:wait}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;display:none}
button.go.busy .spin{display:block}
@keyframes r{to{transform:rotate(360deg)}}
.err{display:none;margin-bottom:14px;padding:10px 12px;border-radius:10px;background:#FDECEA;color:#8A1C12;font-size:13.5px;font-weight:600}
.err.show{display:block;animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.foot{padding:12px 28px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.nojs{padding:20px 28px;color:#8A1C12;font-weight:600}
</style>

<script>
(function(){
  'use strict';
  var P=JSON.parse(document.getElementById('pkg').textContent);
  var f=document.getElementById('lf'),u=document.getElementById('u'),p=document.getElementById('p'),
      go=document.getElementById('go'),gt=document.getElementById('gt'),err=document.getElementById('err'),fails=0;
  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  function showErr(m){err.textContent=m;err.classList.remove('show');void err.offsetWidth;err.classList.add('show');}
  document.getElementById('eye').onclick=function(){var s=p.type==='password';p.type=s?'text':'password';this.textContent=s?'Ẩn':'Hiện';};
  if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){showErr('Trình duyệt không hỗ trợ giải mã. Vui lòng mở bằng Chrome hoặc Edge bản mới.');go.disabled=true;}
  var AAD=(P.aad||'VNPT-HPG-90ND-2026');
  f.addEventListener('submit',async function(e){
    e.preventDefault(); if(go.disabled)return;
    go.disabled=true;go.classList.add('busy');gt.textContent='Đang xác thực…';err.classList.remove('show');
    try{
      var enc=new TextEncoder();
      var uname=u.value.trim().toLowerCase();
      var ue=(P.users||[]).filter(function(x){return x.u===uname;})[0];
      if(!ue) throw new Error('nouser');
      // 1) Khóa người dùng từ (username:password) -> mở khóa "master key"
      var base=await crypto.subtle.importKey('raw',enc.encode(uname+':'+p.value),'PBKDF2',false,['deriveKey']);
      var uk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ue.s),iterations:ue.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var mkRaw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ue.i),additionalData:enc.encode(AAD)},uk,b64(ue.d));
      // 2) Dùng master key giải mã nội dung ứng dụng (chung cho mọi user)
      var mk=await crypto.subtle.importKey('raw',new Uint8Array(mkRaw),{name:'AES-GCM'},false,['decrypt']);
      var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.payload.i),additionalData:enc.encode(AAD)},mk,b64(P.payload.d));
      gt.textContent='Đang mở nội dung…';
      var html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      try{sessionStorage.setItem('vthp_role',ue.role||'user');}catch(_){}
      try{sessionStorage.setItem('vthp_user',uname);}catch(_){}
      P=null; p.value='';
      document.open();document.write(html);document.close();
    }catch(x){
      fails++;
      var wait=Math.min(1000*fails,8000);
      showErr('Tên đăng nhập hoặc mật khẩu không đúng.'+(fails>2?' Vui lòng chờ giây lát rồi thử lại.':''));
      p.value='';p.focus();
      setTimeout(function(){go.disabled=false;go.classList.remove('busy');gt.textContent='Đăng nhập';},wait);
    }
  });
})();
</script>
